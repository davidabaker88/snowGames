<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Every part of this viewport tag is load-bearing on a phone:
        user-scalable=no + maximum-scale=1  stops double-tap zoom, which would
                                            otherwise fight the double-tap gesture
        viewport-fit=cover                  lets the canvas fill past the notch,
                                            with safe-area insets applied to the HUD
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Snowball Fight</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9924;</text></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
